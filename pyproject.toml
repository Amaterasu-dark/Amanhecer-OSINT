[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amanhecer-osint"
version = "0.2.0"
description = "Consultas por arroba, nome, CPF via Serpro, CNPJ e região de telefone"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
amanhecer = "amanhecer.commands.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["amanhecer*"]
